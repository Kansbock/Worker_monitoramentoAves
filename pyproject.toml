[project]
name = "feeder-worker"
version = "0.1.0"
description = "Worker que classifica fotos do comedouro de aves, registra avistamentos na API Aves e organiza o bucket S3 por espécie."
authors = [{ name = "TCC Aves" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "boto3 (>=1.34,<2.0)",
    "tensorflow (>=2.16,<2.17)",
    "pillow (>=10.3,<11.0)",
    "httpx (>=0.27,<0.28)",
    "pydantic (>=2.7,<3.0)",
    "pydantic-settings (>=2.3,<3.0)",
    "tenacity (>=8.3,<9.0)",
    "tzdata (>=2024.1)",
]

[project.scripts]
feeder-worker = "feeder_worker.cli:main"

[tool.poetry]
packages = [{ include = "feeder_worker", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-mock = "^3.14"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
